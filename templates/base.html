<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static',filename='main.css') }}">
    {% block title %}
    <title>Новости ВУЗов</title>
    {% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="site-shell">
    {% block menu %}
    <header class="header">
        <a class="brand" href="{{ url_for('homepage') }}" aria-label="Новости ВУЗов — главная">
            <img src="{{ url_for('static', filename='img/deletephone-Photoroom.png') }}"
                 alt="" aria-hidden="true">
        </a>
        <ul class="mainmenu">
            <li><a href="{{url_for('homepage')}}" class="button">Новости</a></li>
            <li><a href="{{url_for('statistics')}}" class="button">Статистика</a></li>
            <li><a href="{{url_for('about')}}" class="button">О нас</a></li>
        </ul>
    </header>
    {% endblock menu %}
    <main class="page-content">
    {% block homepage %}
    {% endblock  homepage%}
    </main>
</div>
{% block footer %}
<footer class="footer">Новости университетов</footer>
{% endblock footer %}
</body>
</html>
